        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite"/>
      </path>

      <!-- Target Anomaly Blips -->
      <circle cx="34" cy="-26" r="3.5" fill="#ff0055" filter="url(#glow)"/>
      <circle cx="34" cy="-26" r="3.5" fill="none" stroke="#ff0055" stroke-width="1.5" class="ping-ring"/>
      <circle cx="-38" cy="22" r="3" fill="#00ff9d" filter="url(#glow)"/>
      <circle cx="-14" cy="-42" r="2.5" fill="#00f0ff"/>

      <!-- Floating Pixel-Art Core -->
      <g class="pixel-hover">
        <rect x="-10" y="-10" width="20" height="20" fill="#ff007f" opacity="0.3"/>
        <rect x="-6" y="-6" width="12" height="12" fill="#00f0ff" filter="url(#glow)"/>
        <rect x="-3" y="-3" width="6" height="6" fill="#ffffff"/>
      </g>
    </g>

    <!-- Live eBPF / CardioPulse Neural ECG Waveform -->
    <text x="624" y="388" class="hud-metric">eBPF PACKET &amp; NEURAL PULSE STREAM:</text>
    <rect x="624" y="395" width="296" height="34" rx="4" fill="#080218" stroke="#7000ff" stroke-width="1"/>
    <path d="M 628 412 L 665 412 L 675 400 L 685 424 L 695 398 L 705 422 L 715 412 L 760 412 L 770 402 L 780 422 L 790 399 L 800 425 L 810 412 L 855 412 L 865 401 L 875 423 L 885 412 L 916 412" fill="none" stroke="#00ff9d" stroke-width="1.8" class="wave-scroll" filter="url(#glow)"/>

    <!-- Animated System Telemetry Bars -->
    <text x="624" y="448" class="hud-metric">AI / ML INFERENCE ACCURACY</text>
    <text x="920" y="448" text-anchor="end" class="term-ok">94.0%</text>
    <rect x="624" y="453" width="296" height="7" rx="3.5" fill="#160830"/>
    <rect x="624" y="453" width="278" height="7" rx="3.5" fill="url(#cyberAccent)" class="bar-pulse"/>

    <text x="624" y="476" class="hud-metric">SAFECOMPILE AST PRECISION</text>
    <text x="920" y="476" text-anchor="end" class="term-ok">90.2%</text>
    <rect x="624" y="481" width="296" height="7" rx="3.5" fill="#160830"/>
    <rect x="624" y="481" width="267" height="7" rx="3.5" fill="url(#cyberAccent)" class="bar-pulse"/>

    <text x="624" y="504" class="hud-metric">IOT FALSE-ALERT SUPPRESSION</text>
    <text x="920" y="504" text-anchor="end" class="term-ok">99.2%</text>
    <rect x="624" y="509" width="296" height="7" rx="3.5" fill="#160830"/>
    <rect x="624" y="509" width="293" height="7" rx="3.5" fill="#00ff9d" class="bar-pulse"/>
