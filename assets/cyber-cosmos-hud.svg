<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Deep Space Nebula Background -->
    <linearGradient id="nebulaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030008"/>
      <stop offset="35%" stop-color="#09021a"/>
      <stop offset="70%" stop-color="#12042b"/>
      <stop offset="100%" stop-color="#02101f"/>
    </linearGradient>

    <!-- Header Banner Gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080216"/>
      <stop offset="50%" stop-color="#1e0538"/>
      <stop offset="100%" stop-color="#04192e"/>
    </linearGradient>

    <!-- Neon Cyan-Pink Accent Gradient -->
    <linearGradient id="cyberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>

    <!-- Perspective Horizon Grid Gradient -->
    <linearGradient id="gridHorizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ff007f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Radar Sweep Sector Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Crisp Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strict Clip Paths so text NEVER overflows boxes -->
    <clipPath id="leftTermClip">
      <rect x="24" y="180" width="568" height="352" rx="8"/>
    </clipPath>
    <clipPath id="rightHudClip">
      <rect x="608" y="180" width="328" height="352" rx="8"/>
    </clipPath>

    <style>
      .hero-name { font-family: 'Courier New', Courier, monospace; font-size: 36px; font-weight: 900; fill: #ffffff; letter-spacing: 5px; }
      .hero-role { font-family: 'Courier New', Courier, monospace; font-size: 13.5px; font-weight: bold; fill: #00f0ff; letter-spacing: 2.5px; }
      .hero-sub { font-family: 'Courier New', Courier, monospace; font-size: 11.5px; fill: #ff007f; letter-spacing: 1.5px; }
      
      .bar-title { font-family: 'Courier New', Courier, monospace; font-size: 15px; font-weight: bold; fill: #ffffff; letter-spacing: 2px; }
      .bar-tag { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #00ff9d; letter-spacing: 1.5px; }

      .term-cmd { font-family: 'Courier New', Courier, monospace; font-size: 12.5px; fill: #ff007f; font-weight: bold; }
      .term-ok { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #00ff9d; font-weight: bold; }
      .term-cyan { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #00f0ff; }
      .term-gold { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #ffb800; font-weight: bold; }
      .term-white { font-family: 'Courier New', Courier, monospace; font-size: 11.5px; fill: #e2d9ff; }
      .hud-label { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #ff007f; font-weight: bold; letter-spacing: 1.5px; }
      .hud-metric { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #00f0ff; }

      /* Starfield Twinkle */
      .s1 { animation: twinkle 2.4s infinite ease-in-out; }
      .s2 { animation: twinkle 3.6s infinite ease-in-out 1.1s; }
      .s3 { animation: twinkle 1.8s infinite ease-in-out 0.6s; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.35); }
      }

      /* Shooting Comets */
      .comet-1 { animation: shoot1 5.5s linear infinite; }
      .comet-2 { animation: shoot2 7.5s linear infinite 2.5s; }
      @keyframes shoot1 {
        0% { transform: translate(0, 0); opacity: 0; }
        5% { opacity: 1; }
        25% { transform: translate(-550px, 160px); opacity: 0; }
        100% { transform: translate(-550px, 160px); opacity: 0; }
      }
      @keyframes shoot2 {
        0% { transform: translate(0, 0); opacity: 0; }
        5% { opacity: 1; }
        22% { transform: translate(-480px, 140px); opacity: 0; }
        100% { transform: translate(-480px, 140px); opacity: 0; }
      }

      /* Cyberpunk Glitch Title */
      .glitch-title { animation: cyberGlitch 4.5s infinite; }
      @keyframes cyberGlitch {
        0%, 91%, 100% { transform: translate(0, 0); fill: #ffffff; }
        92% { transform: translate(-4px, 1px); fill: #00f0ff; }
        94% { transform: translate(4px, -2px); fill: #ff007f; }
        96% { transform: translate(-2px, 0); fill: #00ff9d; }
      }

      /* Perspective Grid Motion */
      .grid-scroll {
        stroke-dasharray: 10 14;
        animation: gridMove 2.5s linear infinite;
      }
      @keyframes gridMove {
        to { stroke-dashoffset: -48; }
      }

      /* Floating Pixel-Art Sentinel */
      .pixel-hover { animation: floatBob 3s ease-in-out infinite; }
      @keyframes floatBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }

      /* Pulsing Radar Anomaly Ring */
      .ping-ring { animation: radarPing 1.8s ease-out infinite; }
      @keyframes radarPing {
        0% { r: 3; opacity: 1; }
        100% { r: 18; opacity: 0; }
      }

      /* Live ECG / eBPF Packet Waveform Animation */
      .wave-scroll {
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: wavePulse 2.8s linear infinite;
      }
      @keyframes wavePulse {
        0% { stroke-dashoffset: 260; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -260; }
      }

      /* Blinking Terminal Cursor */
      .cursor-blink { animation: blink 0.85s step-end infinite; }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      /* Sequential Boot Animation for Terminal Lines */
      .boot-1 { animation: fadeBoot 10s infinite; }
      .boot-2 { animation: fadeBoot 10s infinite 0.4s; }
      .boot-3 { animation: fadeBoot 10s infinite 0.8s; }
      @keyframes fadeBoot {
        0%, 3% { opacity: 0.25; }
        8%, 95% { opacity: 1; }
        100% { opacity: 0.25; }
      }

      /* CRT Full Scanline Sweep */
      .crt-scan { animation: scanSweep 6s linear infinite; }
      @keyframes scanSweep {
        0% { transform: translateY(-560px); opacity: 0; }
        15% { opacity: 0.28; }
        85% { opacity: 0.28; }
        100% { transform: translateY(560px); opacity: 0; }
      }

      /* Telemetry Progress Bar Pulse */
      .bar-pulse { animation: barGlow 2.2s ease-in-out infinite; }
      @keyframes barGlow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- 1. OUTER COSMIC FRAME -->
  <rect width="960" height="560" rx="16" fill="url(#nebulaBg)" stroke="url(#cyberAccent)" stroke-width="2.5"/>

  <!-- 2. ANIMATED DEEP-SPACE STARFIELD & COMETS -->
  <g fill="#ffffff">
    <circle cx="55" cy="30" r="1.5" class="s1"/>
    <circle cx="145" cy="75" r="1.2" class="s2"/>
    <circle cx="265" cy="25" r="2" class="s3" fill="#00f0ff"/>
    <circle cx="390" cy="95" r="1.4" class="s1"/>
    <circle cx="520" cy="22" r="1.8" class="s2" fill="#ff007f"/>
    <circle cx="670" cy="40" r="1.5" class="s3"/>
    <circle cx="785" cy="85" r="2.2" class="s1" fill="#00ff9d"/>
    <circle cx="895" cy="32" r="1.6" class="s2"/>
    <circle cx="920" cy="120" r="1.3" class="s3"/>
    <circle cx="45" cy="135" r="1.8" class="s2" fill="#00f0ff"/>
  </g>
  <g class="comet-1">
    <line x1="880" y1="15" x2="925" y2="2" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="880" cy="15" r="2.5" fill="#ffffff" filter="url(#glow)"/>
  </g>
  <g class="comet-2">
    <line x1="650" y1="18" x2="690" y2="6" stroke="#ff007f" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="650" cy="18" r="2" fill="#ffffff" filter="url(#glow)"/>
  </g>

  <!-- 3. PERSPECTIVE NEON HORIZON GRID (BOTTOM FLOOR) -->
  <g opacity="0.5">
    <line x1="0" y1="430" x2="960" y2="430" stroke="#ff007f" stroke-width="1.5" filter="url(#glow)"/>
    <line x1="0" y1="458" x2="960" y2="458" stroke="#ff007f" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="0" y1="490" x2="960" y2="490" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="0" y1="528" x2="960" y2="528" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="480" y1="430" x2="-120" y2="560" stroke="url(#gridHorizon)" stroke-width="1.5" class="grid-scroll"/>
    <line x1="480" y1="430" x2="90" y2="560" stroke="url(#gridHorizon)" stroke-width="1.5" class="grid-scroll"/>
    <line x1="480" y1="430" x2="290" y2="560" stroke="url(#gridHorizon)" stroke-width="1.5" class="grid-scroll"/>
    <line x1="480" y1="430" x2="480" y2="560" stroke="url(#gridHorizon)" stroke-width="1.5" class="grid-scroll"/>
    <line x1="480" y1="430" x2="670" y2="560" stroke="url(#gridHorizon)" stroke-width="1.5" class="grid-scroll"/>
    <line x1="480" y1="430" x2="870" y2="560" stroke="url(#gridHorizon)" stroke-width="1.5" class="grid-scroll"/>
    <line x1="480" y1="430" x2="1080" y2="560" stroke="url(#gridHorizon)" stroke-width="1.5" class="grid-scroll"/>
  </g>

  <!-- 4. HERO CYBERPUNK BANNER (REPLACES BROKEN EXTERNAL HEADER) -->
  <rect x="24" y="18" width="912" height="102" rx="10" fill="url(#bannerGrad)" fill-opacity="0.9" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="24" y1="120" x2="936" y2="120" stroke="#ff007f" stroke-width="2" filter="url(#glow)"/>

  <!-- Left Pixel-Art Mystery Sentinel Icon -->
  <g transform="translate(68, 69)" class="pixel-hover">
    <rect x="-26" y="-26" width="52" height="52" rx="6" fill="#09021a" stroke="#ff007f" stroke-width="1.5"/>
    <!-- Pixel Cyber Hood / Visor -->
    <rect x="-14" y="-16" width="28" height="28" fill="#7000ff"/>
    <rect x="-10" y="-12" width="20" height="20" fill="#05010d"/>
    <!-- Glowing Pixel Cyan Visor Eyes -->
    <rect x="-8" y="-4" width="6" height="4" fill="#00f0ff" filter="url(#glow)"/>
    <rect x="2" y="-4" width="6" height="4" fill="#00f0ff" filter="url(#glow)"/>
    <!-- Pixel Antenna -->
    <rect x="-2" y="-22" width="4" height="6" fill="#00ff9d" filter="url(#glow)"/>
    <rect x="-18" y="-2" width="4" height="8" fill="#ff007f"/>
    <rect x="14" y="-2" width="4" height="8" fill="#ff007f"/>
  </g>

  <!-- Center Hero Identity Typography -->
  <text x="480" y="58" text-anchor="middle" class="hero-name glitch-title" filter="url(#glow)">VAIBHAV BHANDARI</text>
  <text x="480" y="84" text-anchor="middle" class="hero-role">CYBERSECURITY  ×  AI / MACHINE LEARNING  ×  IOT TELEMETRY</text>
  <text x="480" y="105" text-anchor="middle" class="hero-sub">[ PYTHON • C++ • FLASK • eBPF/XDP • LLVM • BUILDING SECURE &amp; SCALABLE SYSTEMS ]</text>

  <!-- Right Orbiting Cosmic Atom / Node -->
  <g transform="translate(890, 69)">
    <circle cx="0" cy="0" r="24" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="5 4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ff007f" stroke-width="1.2" stroke-dasharray="3 3">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="5" fill="#00ff9d" filter="url(#glow)"/>
  </g>

  <!-- 5. SYSTEM STATUS BAR -->
  <rect x="24" y="132" width="912" height="36" rx="6" fill="#070214" fill-opacity="0.92" stroke="#ff007f" stroke-width="1.2"/>
  <circle cx="44" cy="150" r="5.5" fill="#ff0055"/>
  <circle cx="62" cy="150" r="5.5" fill="#ffb800"/>
  <circle cx="80" cy="150" r="5.5" fill="#00ff9d"/>
  <text x="102" y="155" class="bar-title" filter="url(#glow)">SYS.NODE // VAIBHAW1103</text>
  <text x="920" y="154" text-anchor="end" class="bar-tag">[ CLEARANCE: OMEGA // DEHRADUN, INDIA // CSE '26 ]</text>

  <!-- 6. LEFT PANEL: ENCRYPTED HACKER TERMINAL (WITH STRICT CLIPPING) -->
  <rect x="24" y="180" width="568" height="352" rx="8" fill="#04010c" fill-opacity="0.92" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="24" y1="208" x2="592" y2="208" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  
  <g clip-path="url(#leftTermClip)">
    <text x="38" y="199" class="term-cmd">root@black-site-orbital:~# ./decrypt_operator_dossier.sh --verified</text>

    <text x="38" y="228" class="term-ok boot-1">[✓] OPERATOR     : Vaibhav Bhandari | B.Tech CSE '26 (GEHU Dehradun)</text>
    <text x="38" y="249" class="term-cyan boot-1">[+] CORE STACK   : Python, C++, SQL, JS | Flask, PyQt5, Next.js, Docker</text>
    <text x="38" y="270" class="term-cyan boot-1">[+] AI / DATA    : Scikit-Learn, TF, PyTorch, Pandas, Feature Eng, MLOps</text>

    <text x="38" y="296" class="term-cmd boot-2">root@black-site-orbital:~# cat /etc/deployed_engines.manifest</text>
    <text x="38" y="317" class="term-white boot-2"> ├─► [01] ZERO-DAY AI FIREWALL : eBPF/XDP + UNSW-NB15 (2.5M rows, 94% Acc)</text>
    <text x="38" y="337" class="term-white boot-2"> ├─► [02] SAFECOMPILE ENGINE   : LLVM/Clang AST + ML Code Security (90% Prec)</text>
    <text x="38" y="357" class="term-white boot-2"> ├─► [03] IOT CARBON &amp; TAMPER  : ESP32 5-Sensor MQTT Grid (635→5 False Alerts)</text>
    <text x="38" y="377" class="term-white boot-2"> ├─► [04] CARDIOPULSE CLINICAL : Gradient Boosting (70K+ Records) + PyQt5 GUI</text>
    <text x="38" y="397" class="term-white boot-2"> └─► [05] NAGARBANDHU &amp; VOX    : Next.js Geo-Civic Platform &amp; 10-Lang AI Voice</text>

    <text x="38" y="424" class="term-gold boot-3">[★] AMAZON ML CHALLENGE : 51% SMAPE via Advanced Feature Engineering</text>
    <text x="38" y="445" class="term-gold boot-3">[★] CLOUD &amp; SEC HONORS  : Top 11% AWS Jam (36/342) • Top 80 GCP Study Jam</text>
    <text x="38" y="466" class="term-cmd boot-3">[!] SEC ARSENAL  : Kali • Wireshark • Nmap • Metasploit • CCNA • Google Sec</text>

    <!-- Live Prompt -->
    <line x1="38" y1="482" x2="576" y2="482" stroke="#7000ff" stroke-width="1" stroke-opacity="0.4"/>
    <text x="38" y="502" class="term-ok">vaibhav@cyber-nexus:~$ ./stream_defense_matrix.py --mode=autonomous</text>
    <text x="38" y="522" class="term-cyan">&gt; STATUS: ALL NEURAL &amp; KERNEL NODES ACTIVE </text>
    <rect x="355" y="510" width="9" height="14" fill="#00ff9d" class="cursor-blink"/>
  </g>

  <!-- 7. RIGHT PANEL: DEEP-SPACE SONAR + LIVE WAVEFORM + TELEMETRY -->
  <rect x="608" y="180" width="328" height="352" rx="8" fill="#04010c" fill-opacity="0.92" stroke="#ff007f" stroke-width="1.5"/>
  <line x1="608" y1="208" x2="936" y2="208" stroke="#ff007f" stroke-width="1" stroke-opacity="0.4"/>

  <g clip-path="url(#rightHudClip)">
    <text x="772" y="199" text-anchor="middle" class="hud-label">[ ORBITAL THREAT SONAR &amp; TELEMETRY ]</text>

    <!-- Rotating Radar Disk -->
    <g transform="translate(772, 292)">
      <circle cx="0" cy="0" r="72" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.35"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.55">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#ff007f" stroke-width="1" stroke-dasharray="4 5" stroke-opacity="0.65">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
      </circle>
      <line x1="-76" y1="0" x2="76" y2="0" stroke="#00f0ff" stroke-width="0.7" stroke-opacity="0.3"/>
      <line x1="0" y1="-76" x2="0" y2="76" stroke="#00f0ff" stroke-width="0.7" stroke-opacity="0.3"/>

      <!-- Radar Sweep Beam -->
