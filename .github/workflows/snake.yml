name: generate neon cyberpunk snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate neon cyberpunk snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vaibhaw1103
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff007f&color_dots=#f0e6ff,#b892ff,#7000ff,#3b096c,#00f0ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#0d0620,#260b4d,#5a108f,#b5179e,#ff007f

      - name: push snake svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
